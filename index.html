    <!-- Suppress benign Vite WebSocket HMR errors in cloud/iframe preview environment -->
    <script>
      (function () {
        function isViteWsError(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return (
            str.includes('websocket closed without opened') ||
            str.includes('failed to connect to websocket') ||
            str.includes('websocket connection') ||
            (str.includes('[vite]') && str.includes('websocket'))
          );
        }

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e.reason;
            var msg = reason ? (reason.message || reason.stack || reason) : '';
            if (isViteWsError(msg)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (e) {
            var msg = e.message || (e.error && e.error.message) || '';
            if (isViteWsError(msg)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );

        var origError = console.error;
        console.error = function () {
          var firstArg = arguments[0];
          if (isViteWsError(firstArg)) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
